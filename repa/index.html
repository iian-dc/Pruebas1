<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no">
<title>Kigo Repartidor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f8f9fb;padding-bottom:90px;max-width:640px;margin:0 auto}
.top{position:sticky;top:0;z-index:50;background:#0a0a0a;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;padding:10px;margin:8px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
#mapRepa{width:100%;height:360px;border-radius:14px;background:#e5e7eb}
.btn{width:100%;height:44px;border:none;border-radius:12px;font-weight:800;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-black{background:#0a0a0a;color:#fff}.btn-green{background:#10b981;color:#fff}.btn-blue{background:#3b82f6;color:#fff}.btn-orange{background:#f59e0b;color:#fff}
.repaCard{border:1.5px solid #111;border-radius:16px;padding:12px;margin-bottom:10px;background:#fff}
.kigo-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:12px}
.kigo-overlay.show{display:flex}
.kigo-modal{background:#fff;border-radius:20px;padding:18px;max-width:360px;width:95%}
#bannerCancelado{position:fixed;top:0;left:0;right:0;z-index:9999;background:#ef4444;color:#fff;padding:10px 14px;font-size:10px;font-weight:800;display:none;justify-content:center;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
</style>
</head>
<body>

<div id="bannerCancelado"></div>

<div class="top">
<div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;background:#fff;color:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800">K</div><b style="font-size:11px" id="nombreTop">REPARTIDOR</b></div>
<select id="selRepaPanel" onchange="cambiarRepa()" style="height:32px;border-radius:8px;padding:0 8px;font-weight:800;font-size:11px;background:#fff;color:#000;border:none"></select>
</div>

<div class="kigo-overlay" id="kigoOverlay"><div class="kigo-modal"><h3 id="modalTitle" style="font-size:13px;font-weight:800;text-align:center">Aviso</h3><p id="modalText" style="font-size:11px;margin:10px 0;color:#374151;text-align:center;white-space:pre-line"></p><div style="display:flex;gap:8px;margin-top:12px"><button id="modalCancel" style="flex:1;height:42px;border-radius:12px;border:1.5px solid #e5e7eb;background:#fff;font-weight:800" onclick="cerrarModal()">Cerrar</button><button id="modalConfirm" class="btn btn-black" style="flex:1">OK</button></div></div></div>

<div class="card" style="padding:8px">
<div id="mapRepa"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<div style="background:#0a0a0a;color:#fff;border-radius:12px;height:42px;display:flex;align-items:center;justify-content:center;gap:6px"><span id="txtKmRepa" style="font-size:11px;font-weight:700">-- km</span><span style="width:1px;height:16px;background:#333"></span><span id="txtCostoRepa" style="font-size:13px;font-weight:800">$0</span></div>
<div style="background:#fff;border:1.5px solid #0a0a0a;border-radius:12px;height:42px;display:flex;align-items:center;justify-content:center;gap:6px"><span id="txtTiempoRepa" style="font-size:11px;font-weight:800">--</span></div>
</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:10px;font-weight:800">PEDIDOS EN ESPERA</span><span id="countEspera" style="background:#f59e0b;color:#fff;padding:3px 8px;border-radius:12px;font-size:9px;font-weight:800">0</span></div>
<div id="listaEspera" style="margin-top:10px"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:10px;font-weight:800">MIS PEDIDOS ACTIVOS</span><span id="countActivos" style="background:#0a0a0a;color:#fff;padding:3px 8px;border-radius:12px;font-size:9px;font-weight:800">0</span></div>
<div id="listaActivos" style="margin-top:10px"></div>
</div>

<audio id="audioNuevo" preload="auto"><source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);

let mapRepa=null, dirRendRepa=null, markersRepa=[], pedidosLive={}, repaActual=null;
let prevEsperaCount=0, audioTimer=null;
let alertasVistas = JSON.parse(localStorage.getItem('kigoAlertasVistas')||'{}');

function getRepa(){
 let url=new URLSearchParams(location.search).get('repa');
 let saved=localStorage.getItem('kigoUser');
 return url||saved||'Jose';
}
repaActual=getRepa();
document.getElementById('nombreTop').innerText=repaActual.toUpperCase();
localStorage.setItem('kigoUser', repaActual);

window.cerrarModal=function(){ document.getElementById('kigoOverlay').classList.remove('show'); }
window.mostrarModal=function({title='Aviso', text='', confirmText='OK', showCancel=true, onConfirm=null}){
 document.getElementById('modalTitle').innerText=title;
 document.getElementById('modalText').innerText=text;
 document.getElementById('modalConfirm').innerText=confirmText;
 document.getElementById('modalCancel').style.display=showCancel?'flex':'none';
 document.getElementById('kigoOverlay').classList.add('show');
 document.getElementById('modalConfirm').onclick=()=>{ cerrarModal(); if(onConfirm) onConfirm(); };
}

function initMap(){
 if(!window.google||!google.maps){ setTimeout(initMap,400); return; }
 mapRepa=new google.maps.Map(document.getElementById('mapRepa'),{center:{lat:21.1556,lng:-100.9343},zoom:14});
 dirRendRepa=new google.maps.DirectionsRenderer({suppressMarkers:true,map:mapRepa,polylineOptions:{strokeColor:'#0a0a0a',strokeWeight:5}});
}
setTimeout(initMap,600);

function sonar6Seg(){
 let audio=document.getElementById('audioNuevo');
 let count=0;
 audio.currentTime=0; audio.play().catch(()=>{});
 let int=setInterval(()=>{
   count++; audio.currentTime=0; audio.play().catch(()=>{});
   if(count>=6){ clearInterval(int); }
 },1000);
}

// SELECT REPAS
onValue(ref(db,'kigoPins'), snap=>{
 let v=snap.val()||{}; let repas=v.repas||v||{};
 let keys=Object.keys(repas);
 let sel=document.getElementById('selRepaPanel');
 sel.innerHTML=keys.map(k=>`<option value="${k}" ${k===repaActual?'selected':''}>${k}</option>`).join('');
});

// LIVE PEDIDOS
onValue(ref(db,'kigoPedidosLive'), snap=>{
 pedidosLive=snap.val()||{};
 renderRepa();
});

// --- NUEVO: ESCUCHA CANCELADOS ---
onValue(ref(db,'kigoAlertasRepa/'+repaActual), snap=>{
 let data=snap.val(); if(!data) return;
 Object.entries(data).forEach(([id,a])=>{
   if(alertasVistas[id]) return;
   if(a.tipo==='cancelado'){
     let banner=document.getElementById('bannerCancelado');
     banner.style.display='flex';
     banner.innerText=`❌ PEDIDO CANCELADO: ${a.cliente} - Ya no está en tu lista`;
     sonar6Seg();
     mostrarModal({title:'PEDIDO CANCELADO', text:`El admin canceló el pedido:\n\nCliente: ${a.cliente}\n\nSe borró de espera y activos automáticamente.`, confirmText:'ENTENDIDO', showCancel:false, onConfirm: async ()=>{
       await remove(ref(db,'kigoAlertasRepa/'+repaActual+'/'+id));
       banner.style.display='none';
     }});
     alertasVistas[id]=true;
     localStorage.setItem('kigoAlertasVistas', JSON.stringify(alertasVistas));
     setTimeout(()=>{ banner.style.display='none'; },7000);
   }
 });
});

function calcularHoraRecogida(ts, min){
 if(!min) return '';
 let f=new Date(ts + parseInt(min)*60000);
 return `Recoger a las ${f.toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit',hour12:true})}`;
}

window.cambiarRepa=function(){
 let nuevo=document.getElementById('selRepaPanel').value;
 localStorage.setItem('kigoUser', nuevo);
 location.href='?repa='+encodeURIComponent(nuevo);
}

function renderRepa(){
 if(!repaActual) return;
 let entries=Object.entries(pedidosLive).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
 let enEspera=entries.filter(([k,p])=> (p.etapa||'pendiente')==='pendiente' || p.etapa==='en_espera' ||!p.activo);
 let misActivos=entries.filter(([k,p])=> p.repaAsignado===repaActual && p.activo);

 // sonido 6 seg si llega nuevo en espera
 if(enEspera.length>prevEsperaCount && prevEsperaCount!==0){ sonar6Seg(); }
 prevEsperaCount=enEspera.length;

 document.getElementById('countEspera').innerText=enEspera.length;
 document.getElementById('countActivos').innerText=misActivos.length;

 let listaEspera=document.getElementById('listaEspera');
 if(!enEspera.length){ listaEspera.innerHTML='<div style="text-align:center;padding:12px;color:#999;font-size:10px">No hay pedidos en espera</div>'; }
 else{
   listaEspera.innerHTML=enEspera.map(([id,p])=>{
     let codigo=id.slice(-4).toUpperCase();
     let horaRec=calcularHoraRecogida(p.ts, p.tiempoRecogida);
     return `<div class="repaCard">
       <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:9px;font-weight:800;background:#f59e0b;color:#fff;padding:2px 6px;border-radius:6px">#${codigo} ${p.tipo||'RECOGER'}</span><span style="font-size:9px;color:#888">${horaRec}</span></div>
       <div style="font-size:11px;font-weight:800">${p.cliente||p.dirRecogida}</div>
       <div style="font-size:9px;color:#555;margin-top:4px"><b>Recoge:</b> ${p.dirRecogida||p.cliente}</div>
       <div style="font-size:9px;color:#555"><b>Entrega:</b> ${p.entrega}</div>
       <div style="font-size:9px;color:#555"><b>Tel:</b> ${p.telefono||''}</div>
       <div style="display:flex;gap:6px;margin-top:8px;font-size:9px;font-weight:800"><span style="background:#0a0a0a;color:#fff;padding:3px 8px;border-radius:20px">${p.km||'--'} km</span><span style="background:#d1fae5;color:#10b981;padding:3px 8px;border-radius:20px">$${p.costoSugerido||0}</span></div>
       ${p.repaAsignado===repaActual?`<button class="btn btn-black" style="margin-top:10px" onclick="aceptarPedido('${id}')">ACEPTAR PEDIDO</button>`: `<div style="font-size:8px;color:#6b7280;margin-top:8px;text-align:center">Asignado a ${p.repaAsignado} - En espera</div><button class="btn btn-black" style="margin-top:6px;height:38px" onclick="aceptarPedido('${id}')">TOMAR PEDIDO</button>`}
     </div>`;
   }).join('');
 }

 let listaActivos=document.getElementById('listaActivos');
 if(!misActivos.length){ listaActivos.innerHTML='<div style="text-align:center;padding:12px;color:#999;font-size:10px">Sin pedidos activos</div>'; }
 else{
   listaActivos.innerHTML=misActivos.map(([id,p])=>{
     let codigo=id.slice(-4).toUpperCase();
     let etapa=p.etapa||'en_camino';
     let btns='';
     if(etapa==='en_camino' || etapa==='pendiente'){ btns=`<button class="btn btn-blue" style="margin-top:10px" onclick="cambiarEtapa('${id}','recogido')">VOY EN CAMINO A RECOGER</button>`; }
     else if(etapa==='recogido'){ btns=`<button class="btn btn-orange" style="margin-top:10px" onclick="cambiarEtapa('${id}','entrega')">RECOGIDO - EN CAMINO A ENTREGA</button>`; }
     else if(etapa==='entrega'){ btns=`<button class="btn btn-green" style="margin-top:10px" onclick="cambiarEtapa('${id}','finalizado')">ENTREGADO - FINALIZAR</button>`; }
     return `<div class="repaCard" style="border-color:#10b981">
       <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:9px;font-weight:800;background:#0a0a0a;color:#fff;padding:2px 6px;border-radius:6px">#${codigo} ${etapa.toUpperCase()}</span><span style="font-size:9px;color:#10b981;font-weight:800">$${p.costoSugerido||0}</span></div>
       <div style="font-size:11px;font-weight:800">${p.cliente}</div>
       <div style="font-size:9px;color:#555;margin-top:4px"><b>Recoge:</b> ${p.dirRecogida}</div>
       <div style="font-size:9px;color:#555"><b>Entrega:</b> ${p.entrega}</div>
       <div style="font-size:9px;color:#555"><b>Tel:</b> ${p.telefono||''}</div>
       <button class="btn" style="height:36px;margin-top:8px;background:#fff;border:1.5px solid #111;font-size:9px" onclick="verRuta('${id}')">VER RUTA EN MAPA</button>
       ${btns}
     </div>`;
   }).join('');
 }
}

window.aceptarPedido=async function(id){
 await update(ref(db,'kigoPedidosLive/'+id),{repaAsignado:repaActual, activo:true, etapa:'en_camino', subEtapa:'camino_recogida'});
 verRuta(id);
}
window.cambiarEtapa=async function(id, nueva){
 if(nueva==='finalizado'){
   let p=pedidosLive[id];
   let hRef=ref(db,'kigoHistorial/'+id);
   await set(hRef,{...p, etapa:'finalizado', finalizadoEn:Date.now()});
   await remove(ref(db,'kigoPedidosLive/'+id));
   mostrarModal({title:'Finalizado', text:'Pedido finalizado y enviado a historial', showCancel:false});
 } else {
   await update(ref(db,'kigoPedidosLive/'+id),{etapa:nueva});
 }
}
window.verRuta=async function(id){
 let p=pedidosLive[id]; if(!p||!mapRepa) return;
 let geocoder=new google.maps.Geocoder();
 let o=await new Promise(r=>{ geocoder.geocode({address:p.dirRecogida+', Dolores Hidalgo'},(re,s)=>{ if(s==='OK') r({lat:re[0].geometry.location.lat(), lng:re[0].geometry.location.lng()}); else r(null); }); });
 let d=await new Promise(r=>{ geocoder.geocode({address:p.entrega+', Dolores Hidalgo'},(re,s)=>{ if(s==='OK') r({lat:re[0].geometry.location.lat(), lng:re[0].geometry.location.lng()}); else r(null); }); });
 if(!o||!d) return;
 let dirServ=new google.maps.DirectionsService();
 dirServ.route({origin:o, destination:d, travelMode:'DRIVING'},(r,s)=>{
   if(s==='OK'){
     dirRendRepa.setDirections(r);
     markersRepa.forEach(m=>m.setMap(null)); markersRepa=[];
     let m1=new google.maps.Marker({position:o, map:mapRepa, icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#ef4444',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});
     let m2=new google.maps.Marker({position:d, map:mapRepa, icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#0a0a0a',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});
     markersRepa=[m1,m2];
     let leg=r.routes[0].legs[0];
     document.getElementById('txtKmRepa').innerText=leg.distance.text;
     document.getElementById('txtCostoRepa').innerText='$'+(p.costoSugerido||0);
     document.getElementById('txtTiempoRepa').innerText=leg.duration.text;
   }
 });
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCTV1sm6McEIkv-cheaVFCD_svp_a--6wg&libraries=places" async defer></script>
</body>
</html>
