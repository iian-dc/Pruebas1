<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kigo Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{
 min-height:100vh;
 display:flex;align-items:center;justify-content:center;padding:20px;
 background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 15%, #f0f9ff 45%, #ffffff 75%, #f8fafc 100%);
 position:relative;
 overflow:hidden;
}
body::before{
 content:'';
 position:absolute;top:0;left:0;right:0;height:50%;
 background: radial-gradient(ellipse at 50% 0%, rgba(14,165,233,0.18) 0%, transparent 70%);
}
.card{
 background:#fff;
 border-radius:24px;
 padding:28px 24px;
 width:100%;max-width:360px;
 box-shadow:0 20px 50px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
 position:relative;z-index:1;
 text-align:center;
}
.titulo{font-weight:800;font-size:22px;letter-spacing:-0.5px}
.titulo.kigo{color:#ef4444}
.titulo.xpress{color:#0a0a0a}

.wrap-input{position:relative;margin-top:16px;text-align:left}
.label{font-size:8px;font-weight:800;color:#0a0a0a;margin-bottom:4px;display:block;letter-spacing:0.6px}
.input-box{
 position:relative;
 display:flex;align-items:center;
 background:#f8fafc;
 border:1.5px solid #e5e7eb;
 border-radius:14px;
 height:46px;
 padding:0 12px;
 transition:.2s;
}
.input-box:focus-within{border-color:#ef4444;background:#fff;box-shadow:0 0 0 3px rgba(239,68,68,0.12)}
.input-box input{
 flex:1;border:none;background:transparent;outline:none;
 font-size:13px;font-weight:600;color:#0f172a;
}
.input-box input::placeholder{color:#94a3b8;font-weight:500}
.btn-clear{
 width:22px;height:22px;border-radius:50%;
 background:#fee2e2;color:#ef4444;
 border:none;display:flex;align-items:center;justify-content:center;
 font-size:12px;font-weight:800;cursor:pointer;
 margin-left:8px;
}
.btn-clear:hover{background:#fecaca}

.btn-entrar{
 width:100%;height:48px;border-radius:14px;
 background: #ef4444;
 color:#fff;font-weight:800;font-size:13px;letter-spacing:0.3px;
 border:none;margin-top:20px;cursor:pointer;
 display:flex;align-items:center;justify-content:center;gap:8px;
 box-shadow:0 8px 20px rgba(239,68,68,0.3);
 transition:.2s;
}
.btn-entrar:active{transform:scale(0.98)}
.btn-entrar:hover{background:#dc2626}

#msg{
 font-size:8px;font-weight:700;
 margin-top:12px;
 min-height:16px;
 color:#ef4444;
 background:#fef2f2;
 border:1px solid #fecaca;
 border-radius:10px;
 padding:0;
 display:none;
}
#msg.show{display:block;padding:8px 10px}
</style>
</head>
<body>
<div class="card">
<div class="titulo"><span class="kigo">Kigo</span> <span class="xpress">Xpress</span></div>

<div class="wrap-input">
<span class="label">USUARIO</span>
<div class="input-box">
<input id="user" type="text" placeholder="Ingresa tu usuario" autocomplete="off">
<button class="btn-clear" onclick="clearInput('user')" type="button">×</button>
</div>
</div>

<div class="wrap-input">
<span class="label">CONTRASEÑA</span>
<div class="input-box">
<input id="pass" type="password" placeholder="Ingresa tu contraseña" autocomplete="off">
<button class="btn-clear" onclick="clearInput('pass')" type="button">×</button>
</div>
</div>

<button class="btn-entrar" onclick="login()">
<span>↵</span> ENTRAR
</button>

<div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);

window.clearInput=function(id){
 document.getElementById(id).value='';
 document.getElementById(id).focus();
}

window.login=async function(){
 let u = document.getElementById('user').value.trim();
 let p = document.getElementById('pass').value.trim();
 let msg = document.getElementById('msg');
 if(!u||!p){
   msg.innerText='Completa usuario y contraseña';
   msg.classList.add('show');
   return;
 }
 msg.classList.remove('show');
 msg.innerText='Verificando...';
 msg.style.display='block';
 msg.style.background='#f0f9ff'; msg.style.borderColor='#bae6fd'; msg.style.color='#0ea5e9';
 try{
  let snap = await get(ref(db,'kigoPins'));
  let data = snap.val()||{admin:'0831', repas:{Jose:'1234'}};
  if(u.toLowerCase()==='admin' && p===data.admin){
    localStorage.setItem('kigoUser','admin');
    localStorage.setItem('kigoRol','admin');
    window.location.href='../admin/'; return;
  }
  if(data.repas && data.repas[u] && data.repas[u]===p){
    localStorage.setItem('kigoUser',u);
    localStorage.setItem('kigoPass',p);
    localStorage.setItem('kigoRol','repa');
    window.location.href='../repa/?repa='+u; return;
  }
  let allRepas = Object.keys(data.repas||{});
  let found = allRepas.find(k=>k.toLowerCase()===u.toLowerCase());
  if(found && data.repas[found]===p){
    localStorage.setItem('kigoUser',found);
    localStorage.setItem('kigoPass',p);
    localStorage.setItem('kigoRol','repa');
    window.location.href='../repa/?repa='+found; return;
  }
  msg.style.color='#ef4444'; msg.style.background='#fef2f2'; msg.style.borderColor='#fecaca';
  msg.innerText='Usuario y contraseña no coincide, intenta de nuevo';
  msg.classList.add('show');
 }catch(e){
  msg.style.color='#ef4444'; msg.style.background='#fef2f2'; msg.style.borderColor='#fecaca';
  msg.innerText='Error: '+e.message;
  msg.classList.add('show');
 }
}
</script>
</body>
</html>
