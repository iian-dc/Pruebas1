<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kigo Login Auto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:360px}
.input{width:100%;height:44px;border:1.5px solid #e5e7eb;border-radius:12px;padding:0 14px;font-size:13px;font-weight:600;margin-top:8px}
.btn{width:100%;height:46px;border-radius:12px;background:#0a0a0a;color:#fff;font-weight:800;border:none;margin-top:14px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<div style="text-align:center;margin-bottom:14px"><b>KIGO XPRESS</b><div style="font-size:7px;color:#6b7280">LOGIN AUTOMATICO</div></div>
<input id="user" class="input" placeholder="Usuario">
<input id="pass" class="input" type="password" placeholder="Contraseña">
<button class="btn" onclick="login()">ENTRAR</button>
<div id="msg" style="font-size:8px;color:#6b7280;margin-top:10px;text-align:center"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);

window.login=async function(){
 let u = document.getElementById('user').value.trim();
 let p = document.getElementById('pass').value.trim();
 if(!u||!p){ document.getElementById('msg').innerText='Falta usuario'; return; }
 document.getElementById('msg').innerText='Verificando...';
 try{
  let sPins = await get(ref(db,'kigoPins')); let pins = sPins.val()||{};
  // ES ADMIN?
  if(u.toLowerCase()==='admin' && pins.admin==p){
    localStorage.setItem('kigoUser','admin'); localStorage.setItem('kigoRol','admin'); window.location.href='../admin/'; return;
  }
  // BUSCA SI ES REPA EN CUALQUIER NODO
  let keys = [ref(db,'kigoRepasFull/'+u), ref(db,'kigoUsuarios/'+u), ref(db,'kigoRepas/'+u)];
  for(let r of keys){
   let snap = await get(r); if(snap.exists()){
    let d = snap.val(); let passOk = d.pass||d.password||d.pin;
    if(passOk==p){
     localStorage.setItem('kigoUser', d.usuario||d.nombre||u); localStorage.setItem('kigoPass',p); localStorage.setItem('kigoRol','repa');
     window.location.href='../repa/?repa='+(d.usuario||u); return;
    }
   }
  }
  // BUSCA EN kigoPins/repas
  if(pins.repas && pins.repas[u] && pins.repas[u]==p){
   localStorage.setItem('kigoUser',u); localStorage.setItem('kigoPass',p); localStorage.setItem('kigoRol','repa');
   window.location.href='../repa/?repa='+u; return;
  }
  document.getElementById('msg').innerText='❌ Usuario o contraseña incorrecta';
 }catch(e){ document.getElementById('msg').innerText='Error: '+e.message; }
}
</script>
</body>
</html>
