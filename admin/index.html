*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{--black:#0a0a0a;--border:#e5e7eb}

.kigo-btn{height:38px;border-radius:10px;border:none;font-weight:800;font-size:10px;flex:1;display:flex;align-items:center;justify-content:center}
.kigo-btn-cancel{background:#fff;border:1.5px solid var(--border)}.kigo-btn-confirm{background:#0a0a0a;color:#fff}
.ico{width:12px;height:12px;display:inline-block;vertical-align:middle}
.btn-small{height:36px;border-radius:10px;font-size:9px;font-weight:800}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDGTYI2ZZnP49DbaMIpRSoGIjZrU6RAEiE", authDomain: "historial-kigo-xpress.firebaseapp.com", databaseURL: "https://historial-kigo-xpress-default-rtdb.firebaseio.com", projectId: "historial-kigo-xpress", storageBucket: "historial-kigo-xpress.firebasestorage.app", messagingSenderId: "571399920545", appId: "1:571399920545:web:aa16407753b43cbe2e89e0" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);

window.mostrarModalElegante=function({title='Aviso', text='Mensaje', cancelText='Cancelar', confirmText='Confirmar', confirmClass='', showCancel=true, onConfirm=null}){
 document.getElementById('modalTitle').innerText=title; document.getElementById('modalText').innerText=text;
 document.getElementById('modalCancel').innerText=cancelText; document.getElementById('modalConfirm').innerText=confirmText;
 document.getElementById('modalCancel').style.display=showCancel?'flex':'none';
 document.getElementById('modalConfirm').className='kigo-btn kigo-btn-confirm '+(confirmClass||'');
 document.getElementById('kigoOverlay').classList.add('show');
 document.getElementById('modalConfirm').onclick=()=>{ cerrarModal(); if(onConfirm) onConfirm(); };
}
window.cerrarModal=function(){ document.getElementById('kigoOverlay').classList.remove('show'); }
window.mostrarAviso=function(msg,t='Listo'){ mostrarModalElegante({title:t,text:msg,showCancel:false,confirmText:'Entendido',confirmClass:'green'}); }
window.confirmarAccion=function(msg,t,onConfirm,ct='Confirmar',color=''){ mostrarModalElegante({title:t,text:msg,cancelText:'Cancelar',confirmText:ct,confirmClass:color,showCancel:true,onConfirm}); }

let tarifasKmConfig={porKm:8, centroRadio:1.5, centroTarifa:30, lejosRadio:4, lejosExtra:15};
let pinsData={admin:'0831',repas:{'Jose':'1111','Diego Gómez':'2222','Diego':'3333','Carlos':'4444'}};
let clientesDirecciones={}, ventas=[], tipoPedidoActual='recoger', opcionRecoger='cliente', tiempoRecogidaMin=20, tiempoCompraMin=15;
let map=null, dirServ=null, dirRend=null, geocoder=null, markers=[], clientePedidoSeleccionado=null, clienteCompraSeleccionado=null, ultimaCotizacion=null, entregaCoordsTemp=null, recogidaCoordsTemp=null, compraOrigenCoords=null, compraEntregaCoords=null, statusRepas={};

function calcularHoraRecogida(min){ let ahora=new Date(); ahora.setMinutes(ahora.getMinutes()+parseInt(min||20)); let h=ahora.getHours(); let m=String(ahora.getMinutes()).padStart(2,'0'); let ampm=h>=12?'PM':'AM'; let h12=h%12||12; return {texto:`RECOGER ${h12}:${m} ${ampm}`, iso:ahora.toISOString()}; }
function initMapReal(){ if(!window.google||!google.maps){ setTimeout(initMapReal,400); return; } if(!geocoder) geocoder=new google.maps.Geocoder(); if(!map){ map=new google.maps.Map(document.getElementById('map'),{center:{lat:21.1556,lng:-100.9343},zoom:14}); dirServ=new google.maps.DirectionsService(); dirRend=new google.maps.DirectionsRenderer({suppressMarkers:true,map:map,polylineOptions:{strokeColor:'#10b981',strokeWeight:5}}); } initPlaces(); }
function initPlaces(){
 if(!window.google||!google.maps.places){ setTimeout(initPlaces,600); return; }
 let opts={componentRestrictions:{country:'mx'}};
 let elRecogida=document.getElementById('direccionRecogidaManual');
 let elEntrega=document.getElementById('entregaDirRecoger');
 let elEntregaCompra=document.getElementById('entregaDirComprar');
 let elDondeComprar=document.getElementById('queComprar');
 if(elRecogida&&!elRecogida.dataset.ac){ let ac=new google.maps.places.Autocomplete(elRecogida, opts); ac.addListener('place_changed',()=>{ let place=ac.getPlace(); if(place.geometry){ recogidaCoordsTemp={lat:place.geometry.location.lat(),lng:place.geometry.location.lng()}; pintarPuntoRecogida(recogidaCoordsTemp); intentarAutoRuta(); } }); elRecogida.dataset.ac='1'; }
 if(elEntrega&&!elEntrega.dataset.ac){ let ac=new google.maps.places.Autocomplete(elEntrega, opts); ac.addListener('place_changed',()=>{ let place=ac.getPlace(); if(place.geometry){ entregaCoordsTemp={lat:place.geometry.location.lat(),lng:place.geometry.location.lng()}; intentarAutoRuta(); } }); elEntrega.dataset.ac='1'; }
 if(elDondeComprar&&!elDondeComprar.dataset.ac){ let ac=new google.maps.places.Autocomplete(elDondeComprar, opts); ac.addListener('place_changed',()=>{ let place=ac.getPlace(); if(place.geometry){ compraOrigenCoords={lat:place.geometry.location.lat(),lng:place.geometry.location.lng()}; intentarAutoRutaCompra(); } }); elDondeComprar.dataset.ac='1'; }
 if(elEntregaCompra&&!elEntregaCompra.dataset.ac){ let ac=new google.maps.places.Autocomplete(elEntregaCompra, opts); ac.addListener('place_changed',()=>{ let place=ac.getPlace(); if(place.geometry){ compraEntregaCoords={lat:place.geometry.location.lat(),lng:place.geometry.location.lng()}; entregaCoordsTemp=compraEntregaCoords; intentarAutoRutaCompra(); } }); elEntregaCompra.dataset.ac='1'; }
}
function pintarPuntoRecogida(coords){ if(!map||!coords) return; map.setCenter(coords); map.setZoom(15); markers.forEach(m=>m.setMap(null)); markers=[]; let m1=new google.maps.Marker({position:coords,map:map,icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#10b981',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}}); markers.push(m1); }
function pintarSoloEntrega(coords){ if(!map||!coords) return; if(!recogidaCoordsTemp){ map.setCenter(coords); map.setZoom(15); markers.forEach(m=>m.setMap(null)); markers=[]; let m2=new google.maps.Marker({position:coords,map:map,icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#ef4444',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}}); markers=[m2]; } }

function intentarAutoRuta(){

 dirServ.route({origin:recogidaCoordsTemp, destination:entregaCoordsTemp, travelMode:'DRIVING'},(r,s)=>{

function calcularCostoPorKm(km){ let k=parseFloat(km); if(isNaN(k)) return tarifasKmConfig.centroTarifa; let cfg=tarifasKmConfig; if(k<=cfg.centroRadio) return cfg.centroTarifa; let costo=cfg.centroTarifa + (k-cfg.centroRadio)*cfg.porKm; if(k>=cfg.lejosRadio) costo+=cfg.lejosExtra; return Math.round(costo); }
function calcularCostoCompra(km){ let k=parseFloat(km); if(isNaN(k)) return 42; let base=42; let radio=tarifasKmConfig.centroRadio||1.5; if(k<=radio) return base; let costo=base + (k-radio)*5; return Math.round(costo); }

};
