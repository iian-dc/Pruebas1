<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santillos - Pedidos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--theme:#ffcc00}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0f0f0f;color:#fff;padding-bottom:90px;max-width:500px;margin:0 auto}
.header{position:relative;background:#1a1a1a;padding:35px 20px 25px;text-align:center;background-size:cover;background-position:center}
.header::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.9))}
.header > *{position:relative;z-index:1}
.status{position:absolute;top:14px;right:14px;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;border:1.5px solid #22c55e;box-shadow:0 0 12px #22c55e}
.logo{width:90px;height:90px;background:#fff;border-radius:50%;margin:0 auto 14px;overflow:hidden;border:3px solid var(--theme)}
.logo img{width:100%;height:100%;object-fit:cover}
.name{font-size:28px;font-weight:900}.name span{color:var(--theme)}
.tag{font-size:11px;letter-spacing:3px;color:#ccc;margin-top:4px;font-weight:700}
.cats{display:flex;gap:10px;overflow-x:auto;padding:16px;position:sticky;top:0;background:#0f0f0f;z-index:10;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;padding:10px 18px;border-radius:25px;border:1.5px solid #2a2a2a;background:#1c1c1c;color:#fff;font-weight:800;font-size:13px;cursor:pointer}
.cat.active{background:var(--theme);color:#111;border-color:var(--theme)}
.products{padding:16px;display:grid;gap:14px}
.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:18px;display:flex;overflow:hidden}
.card img{width:110px;height:110px;object-fit:cover}
.info{padding:12px;flex:1;display:flex;flex-direction:column}
.p-name{font-weight:900;font-size:15px}.p-desc{font-size:11px;color:#aaa;margin-top:3px}
.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px}
.price{color:var(--theme);font-weight:900;font-size:16px}
.qty{display:flex;align-items:center;background:#2a2a2a;border-radius:20px;padding:2px;border:1px solid #3a3a3a}
.q-btn{width:28px;height:28px;border-radius:50%;border:none;background:var(--theme);color:#111;font-weight:900;cursor:pointer}
.q-num{width:28px;text-align:center;font-weight:900;font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:#1c1c1c;border-top:1px solid #2a2a2a;display:flex;justify-content:space-around;align-items:center;padding:8px 10px 14px;z-index:100;border-radius:20px 20px 0 0}
.nav button{background:none;border:none;color:#fff;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.cart-badge{position:absolute;top:-4px;right:6px;background:#E53935;color:#fff;font-size:9px;font-weight:900;padding:2px 6px;border-radius:10px}
.wrap{position:relative}
.cart-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none}.cart-modal.show{display:block}
.cart-box{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:#161616;border-radius:24px 24px 0 0;z-index:201;max-height:85vh;display:none;flex-direction:column}.cart-box.show{display:flex}
.cart-head{padding:18px 20px;display:flex;justify-content:space-between;border-bottom:1px solid #2a2a2a;font-weight:900}
.cart-body{overflow-y:auto;padding:16px;flex:1}
.c-item{display:flex;gap:12px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
.c-item img{width:50px;height:50px;border-radius:10px;object-fit:cover}
.btn-pedir{width:100%;background:var(--theme);color:#111;border:none;padding:14px;border-radius:14px;font-weight:900;cursor:pointer}
.checkout{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;max-width:500px;margin:0 auto;background:#f8f8f8;overflow-y:auto}.checkout.show{display:flex}
#map{height:380px;width:100%}
.input{background:#fff;padding:20px;margin-top:10px}.input label{font-size:11px;font-weight:800;color:#666;display:block;margin-bottom:6px}
.input input{width:100%;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:12px;padding:14px;color:#111;outline:none;margin-bottom:12px}
.resumen{background:#fff;margin-top:10px;padding:20px}.row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:#666}.row.total{font-weight:900;color:#111;font-size:18px;border-top:1px dashed #e0e0e0;padding-top:12px}
.btn-wsp{margin:20px;background:#25D366;color:#fff;border:none;padding:18px;border-radius:16px;font-weight:900;font-size:16px;cursor:pointer}
.admin{position:fixed;inset:0;z-index:500;display:none;flex-direction:column;max-width:500px;margin:0 auto;background:#f5f5f5;overflow:hidden}.admin.show{display:flex}
.a-head{background:#0f0f0f;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:900}
.a-body{flex:1;overflow-y:auto;padding:16px}
.a-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #eee}
.a-input{width:100%;padding:12px;border:1px solid #e5e5e5;border-radius:10px;background:#f9f9f9;margin-top:6px;outline:none}
.a-btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:12px;background:var(--theme)}
</style>
</head>
<body>

<div class="header" id="header">
<div class="status">● ABIERTO</div>
<div class="logo"><img id="logoImg" src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png"></div>
<div class="name" id="restName">Santi <span>llos</span></div>
<div class="tag">DOLORES HIDALGO • COMIDA RÁPIDA</div>
</div>

<div class="cats" id="cats"></div>
<div class="products" id="products"></div>

<div class="nav">
<button onclick="scrollToTop()">🏠<span>INICIO</span></button>
<button onclick="abrirAdmin()">⚙️<span>ADMIN</span></button>
<div class="wrap"><button onclick="abrirCarrito()">🛒<span>CARRITO</span></button><div class="cart-badge" id="cartCount">0</div></div>
</div>

<div class="cart-modal" id="cartOverlay" onclick="cerrarCarrito()"></div>
<div class="cart-box" id="cartBox">
<div class="cart-head"><span>🛒 Tu Pedido</span><button onclick="cerrarCarrito()" style="background:#2a2a2a;color:#fff;border:none;width:28px;height:28px;border-radius:50%">✕</button></div>
<div class="cart-body" id="cartList"></div>
<div style="padding:16px;border-top:1px solid #2a2a2a"><button class="btn-pedir" onclick="abrirCheckout()">CONFIRMAR PEDIDO ✅</button></div>
</div>

<div class="checkout" id="checkout">
<div style="padding:18px 20px;display:flex;justify-content:space-between;background:#0f0f0f;color:#fff;position:sticky;top:0"><b>📍 Datos de entrega</b><button onclick="cerrarCheckout()" style="background:#2a2a2a;color:#fff;border:none;width:28px;height:28px;border-radius:50%">✕</button></div>
<div id="map"></div>
<div class="input">
<label>NOMBRE COMPLETO</label><input id="cliNombre" placeholder="Juan Pérez">
<label>WHATSAPP</label><input id="cliTel" placeholder="418 123 4567">
<label>DIRECCIÓN</label><input id="cliDir" placeholder="Calle 45, Centro">
<label>REFERENCIA</label><input id="cliRef" placeholder="Casa azul, portón negro">
</div>
<div class="resumen">
<div class="row"><span>Subtotal</span><span id="rSub">$0</span></div>
<div class="row"><span>Envío</span><span id="rEnv">$25</span></div>
<div class="row total"><span>Total</span><span id="rTotal">$0</span></div>
</div>
<button class="btn-wsp" onclick="enviarPedido()">Enviar por WhatsApp 💬</button>
</div>

<div class="admin" id="admin">
<div class="a-head"><span>PANEL ADMIN</span><button onclick="cerrarAdmin()" style="background:#2a2a2a;color:#fff;border:none;width:28px;height:28px;border-radius:50%">✕</button></div>
<div class="a-body">
<div class="a-card">
<b>➕ Agregar Producto</b>
<label style="font-size:11px;font-weight:800;margin-top:12px;display:block">CATEGORIA</label><input id="pCat" class="a-input" placeholder="Ej: Hamburguesas">
<label style="font-size:11px;font-weight:800;margin-top:8px;display:block">NOMBRE</label><input id="pName" class="a-input">
<label style="font-size:11px;font-weight:800;margin-top:8px;display:block">DESCRIPCION</label><input id="pDesc" class="a-input">
<label style="font-size:11px;font-weight:800;margin-top:8px;display:block">PRECIO</label><input id="pPrice" type="number" class="a-input">
<label style="font-size:11px;font-weight:800;margin-top:8px;display:block">IMAGEN URL</label><input id="pImg" class="a-input" placeholder="https://...">
<button class="a-btn" onclick="guardarProd()">Guardar Producto</button>
</div>
<div class="a-card">
<b>🏪 Configuración</b>
<label style="font-size:11px;font-weight:800;margin-top:12px;display:block">Nombre Negocio</label><input id="cName" class="a-input">
<label style="font-size:11px;font-weight:800;margin-top:8px;display:block">WhatsApp (con lada Ej: 524181234567)</label><input id="cWsp" class="a-input">
<label style="font-size:11px;font-weight:800;margin-top:8px;display:block">Color Tema</label><input id="cColor" type="color" class="a-input" style="height:45px">
<button class="a-btn" onclick="guardarConfig()">Guardar Config</button>
</div>
<div id="listaAdmin"></div>
</div>
</div>

<script>
let config = JSON.parse(localStorage.getItem('cfg')) || {nombre:'Santillos', whatsapp:'524181234567', color:'#ffcc00', envio:25}
let menu = JSON.parse(localStorage.getItem('menu')) || {
"Hamburguesas":[
{n:'Hamburguesa Clásica',d:'Carne, queso, lechuga',p:85,img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=400'},
{n:'Hamburguesa Doble',d:'Doble carne y queso',p:120,img:'https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=400'}
],
"Bebidas":[
{n:'Coca Cola 600ml',d:'Bien fría',p:25,img:'https://images.unsplash.com/photo-1553456558-aff63285bdd1?w=400'},
{n:'Agua Fresca',d:'Jamaica / Horchata',p:30,img:'https://images.unsplash.com/photo-1544148103-005eec06c6ed?w=400'}
]
};
let carrito={}, cantidades={};
let map, marker;

function init(){
 document.documentElement.style.setProperty('--theme', config.color);
 document.getElementById('restName').innerHTML = config.nombre.split(' ')[0]+' <span>'+ (config.nombre.split(' ')[1]||'') +'</span>';
 renderCats(); renderProds(Object.keys(menu)[0]);
}
function renderCats(){
 let h=''; Object.keys(menu).forEach((c,i)=>{
   h+=`<div class="cat ${i==0?'active':''}" onclick="renderProds('${c}',this)">${c}</div>`;
 }); document.getElementById('cats').innerHTML=h;
}
function renderProds(cat, el){
 if(el){ document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active')); el.classList.add('active'); }
 let h=''; (menu[cat]||[]).forEach((p,idx)=>{
   let id = cat+'_'+idx;
   let q = cantidades[id]||0;
   h+=`<div class="card"><img src="${p.img}"><div class="info"><div class="p-name">${p.n}</div><div class="p-desc">${p.d}</div><div class="bottom"><div class="price">$${p.p}</div><div class="qty"><button class="q-btn" onclick="cambiarQty('${id}',-1)">-</button><div class="q-num" id="q_${id}">${q||1}</div><button class="q-btn" onclick="cambiarQty('${id}',1)">+</button></div><button class="q-btn" style="margin-left:6px" onclick="addCarrito('${cat}',${idx})">+</button></div></div></div>`;
 }); document.getElementById('products').innerHTML=h;
}
function cambiarQty(id, delta){
 let el=document.getElementById('q_'+id);
 let v=parseInt(el.innerText||1)+delta; if(v<1)v=1; el.innerText=v; cantidades[id]=v;
}
function addCarrito(cat, idx){
 let id = cat+'_'+idx; let q = cantidades[id]||parseInt(document.getElementById('q_'+id)?.innerText||1);
 if(!carrito[id]) carrito[id]={...menu[cat][idx], qty:0, cat};
 carrito[id].qty+=q; actualizarCarrito();
 let badge=document.getElementById('cartCount'); badge.animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:300});
}
function actualizarCarrito(){
 let total=0, count=0, html='';
 Object.values(carrito).forEach(item=>{
   total+=item.p*item.qty; count+=item.qty;
   html+=`<div class="c-item"><img src="${item.img}"><div style="flex:1"><div style="font-weight:800;font-size:13px">${item.n}</div><div style="color:var(--theme);font-size:12px">$${item.p} x ${item.qty}</div></div><button onclick="delItem('${item.cat}_${menu[item.cat].indexOf(item)}')" style="background:#2a2a2a;border:none;color:#ff4444;width:26px;height:26px;border-radius:50%">✕</button></div>`;
 });
 if(!html) html='<div style="text-align:center;padding:30px;color:#888">Carrito vacío</div>';
 document.getElementById('cartList').innerHTML=html;
 document.getElementById('cartCount').innerText=count;
 document.getElementById('rSub').innerText='$'+total;
 document.getElementById('rTotal').innerText='$'+(total+config.envio);
}
function delItem(id){ delete carrito[id]; actualizarCarrito(); }
function abrirCarrito(){ document.getElementById('cartOverlay').classList.add('show'); document.getElementById('cartBox').classList.add('show'); }
function cerrarCarrito(){ document.getElementById('cartOverlay').classList.remove('show'); document.getElementById('cartBox').classList.remove('show'); }
function abrirCheckout(){
 if(Object.keys(carrito).length==0){ alert('Carrito vacío'); return; }
 cerrarCarrito(); document.getElementById('checkout').classList.add('show');
 setTimeout(()=>{
   if(!map){ map=L.map('map').setView([21.1556,-100.9348],15); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); marker=L.marker([21.1556,-100.9348],{draggable:true}).addTo(map); }
   map.invalidateSize();
 },300);
}
function cerrarCheckout(){ document.getElementById('checkout').classList.remove('show'); }
function enviarPedido(){
 let n=document.getElementById('cliNombre').value, t=document.getElementById('cliTel').value, d=document.getElementById('cliDir').value;
 if(!n||!t||!d){ alert('Faltan datos'); return; }
 let msg=`*PEDIDO ${config.nombre}*%0A`;
 Object.values(carrito).forEach(i=>{ msg+=`• ${i.n} x${i.qty} - $${i.p*i.qty}%0A`; });
 msg+=`%0A*Cliente:* ${n}%0A*Tel:* ${t}%0A*Dir:* ${d}%0A*Ref:* ${document.getElementById('cliRef').value}%0A*Total:* ${document.getElementById('rTotal').innerText}`;
 window.open(`https://wa.me/${config.whatsapp}?text=${msg}`,'_blank');
}
function abrirAdmin(){
 document.getElementById('cName').value=config.nombre;
 document.getElementById('cWsp').value=config.whatsapp;
 document.getElementById('cColor').value=config.color;
 renderAdminList();
 document.getElementById('admin').classList.add('show');
}
function cerrarAdmin(){ document.getElementById('admin').classList.remove('show'); }
function guardarProd(){
 let c=document.getElementById('pCat').value, n=document.getElementById('pName').value, d=document.getElementById('pDesc').value, p=parseInt(document.getElementById('pPrice').value), img=document.getElementById('pImg').value||'https://via.placeholder.com/200';
 if(!c||!n||!p){ alert('Faltan datos'); return; }
 if(!menu[c]) menu[c]=[]; menu[c].push({n,d,p,img});
 localStorage.setItem('menu',JSON.stringify(menu)); renderCats(); renderAdminList();
 document.getElementById('pName').value=''; document.getElementById('pPrice').value='';
}
function guardarConfig(){
 config.nombre=document.getElementById('cName').value||config.nombre;
 config.whatsapp=document.getElementById('cWsp').value||config.whatsapp;
 config.color=document.getElementById('cColor').value||config.color;
 localStorage.setItem('cfg',JSON.stringify(config)); init(); alert('Guardado ✅');
}
function renderAdminList(){
 let h=''; Object.keys(menu).forEach(cat=>{
   menu[cat].forEach((p,i)=>{
     h+=`<div style="display:flex;gap:10px;background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;align-items:center;border:1px solid #eee"><img src="${p.img}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><div style="flex:1"><b style="font-size:13px;color:#111">${p.n}</b><div style="font-size:11px;color:#888">${cat} - $${p.p}</div></div><button onclick="borrarProd('${cat}',${i})" style="background:#ffe8e8;color:#ff3333;border:none;width:30px;height:30px;border-radius:8px">✕</button></div>`;
   });
 }); document.getElementById('listaAdmin').innerHTML=h;
}
function borrarProd(cat,i){ menu[cat].splice(i,1); if(menu[cat].length==0) delete menu[cat]; localStorage.setItem('menu',JSON.stringify(menu)); renderCats(); renderAdminList(); renderProds(Object.keys(menu)[0]||''); }
function scrollToTop(){ window.scrollTo({top:0,behavior:'smooth'}); }
init(); actualizarCarrito();
</script>
</body>
</html>
