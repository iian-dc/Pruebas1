<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kigo - Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCTV1sm6McEIkv-cheaVFCD_svp_a--6wg&libraries=places"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Manrope,sans-serif;background:#fafafa;padding:12px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:14px;margin-bottom:10px}
#map{width:100%;height:380px;border-radius:18px;border:1px solid #e5e7eb}
.label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:4px;display:block}
.wrap{border:1.5px solid #e5e7eb;border-radius:14px;background:#fff;overflow:hidden;position:relative}
.wrap input,.wrap select{width:100%;height:46px;border:none;outline:none;padding:0 12px;font-size:13px;font-weight:600}
.btn{width:100%;height:52px;background:#0a0a0a;color:#fff;border:none;border-radius:14px;font-weight:800;font-size:13px;cursor:pointer}
.btn2{width:100%;height:44px;background:#10b981;color:#fff;border:none;border-radius:12px;font-weight:800;font-size:11px;cursor:pointer;margin-top:8px}
.tab{height:40px;flex:1;border-radius:12px;border:1.5px solid #e5e7eb;background:#fff;font-size:10px;font-weight:800;cursor:pointer}
.tab.active{background:#0a0a0a;color:#fff}
#listCli{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1.5px solid #0a0a0a;border-top:none;border-radius:0 0 14px 14px;max-height:260px;overflow:auto;display:none}
</style>
</head>
<body>

<div class="card" style="padding:8px">
<div id="map"></div>
<div id="infoRuta" style="display:none;margin-top:10px;background:#0a0a0a;color:#fff;border-radius:12px;padding:10px 12px;font-size:11px;font-weight:700"></div>
</div>

<div class="card">
<div style="display:flex;gap:8px;margin-bottom:12px">
<button id="btnCli" class="tab active" onclick="setModo('cli')">Cliente registrado</button>
<button id="btnDir" class="tab" onclick="setModo('dir')">Dirección manual</button>
</div>

<div id="panelCli">
<div class="wrap" style="overflow:visible">
<input type="text" id="buscCli" placeholder="Buscar cliente..." oninput="buscarCli()" onfocus="buscarCli()" autocomplete="off">
<div id="listCli"></div>
</div>
<div id="selCliBox" style="display:none;margin-top:8px;background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:10px;font-size:11px;font-weight:700"></div>
<div style="margin-top:8px"><span class="label">Telefono recogida</span><div class="wrap"><input type="tel" id="telRecoge" placeholder="Tel quien entrega"></div></div>
</div>

<div id="panelDir" style="display:none">
<span class="label">Nombre cliente nuevo</span><div class="wrap"><input type="text" id="nombreNuevo" placeholder="Ej. Maria - Papeleria"></div>
<span class="label" style="margin-top:8px">Dirección recogida manual</span><div class="wrap"><input type="text" id="dirManual" placeholder="Ej. Nayarit 31"></div>
<span class="label" style="margin-top:8px">Telefono recogida</span><div class="wrap"><input type="tel" id="telRecogeDir" placeholder="Tel"></div>
</div>

<div style="margin-top:12px;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:14px;padding:10px">
<span class="label">Entregar en</span>
<div class="wrap"><input type="text" id="dirEntrega" placeholder="Dirección entrega - autocompleta Google"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<div><span class="label">Telefono entrega</span><div class="wrap"><input type="tel" id="telEntrega" placeholder="552..."></div></div>
<div><span class="label">Referencia entrega</span><div class="wrap"><input type="text" id="refEntrega" placeholder="Casa azul..."></div></div>
</div>
</div>

<div style="margin-top:12px">
<span class="label">Enviar a repartidor</span>
<div class="wrap"><select id="selRepa"></select></div>
</div>

<button class="btn" style="margin-top:12px" onclick="cotizar()">COTIZAR CON GOOGLE MAPS</button>
<button class="btn2" onclick="confirmar()">CONFIRMAR PEDIDO Y ENVIAR A REPA</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, set, push } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
const cfg={apiKey:"AIzaSyCTV1sm6McEIkv-cheaVFCD_svp_a--6wg",authDomain:"kigo-67dd3.firebaseapp.com",projectId:"kigo-67dd3",storageBucket:"kigo-67dd3.firebasestorage.app",messagingSenderId:"1070993147798",appId:"1:1070993147798:web:2d3d4ac9c3b5a5c9e7b5a5",databaseURL:"https://kigo-67dd3-default-rtdb.firebaseio.com"};
const app=initializeApp(cfg); const db=getDatabase(app);

let map, dirServ, dirRend, autEntrega, autManual;
let clientes={}; let modo='cli'; let cliSel=null; let pedidoCotizado=null; let pins={}; let tarifas={mandado:35};

function todayISO(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

onValue(ref(db,'kigoClientesDir'),s=>{
let v=s.val()||{}; let m={};
Object.entries(v).forEach(([k,d])=>{let nombre=k.replace(/_/g,' '); if(d&&d.direccion) m[nombre]=d;});
clientes=m;
});

onValue(ref(db,'kigoPins'),s=>{
let v=s.val(); if(v&&v.repas){pins=v.repas; let sel=document.getElementById('selRepa'); sel.innerHTML=Object.keys(pins).map(r=>`<option value="${r}">${r}</option>`).join('');}
});

onValue(ref(db,'kigoTarifas'),s=>{if(s.val()) tarifas=s.val();});

window.setModo=function(m){
modo=m;
document.getElementById('btnCli').classList.toggle('active',m==='cli');
document.getElementById('btnDir').classList.toggle('active',m==='dir');
document.getElementById('panelCli').style.display=m==='cli'?'block':'none';
document.getElementById('panelDir').style.display=m==='dir'?'block':'none';
if(m==='dir'){cliSel=null; document.getElementById('selCliBox').style.display='none';}
}

window.buscarCli=function(){
let q=document.getElementById('buscCli').value.toLowerCase().trim();
let list=document.getElementById('listCli');
let todos=Object.keys(clientes);
if(!q){list.style.display='none';return;}
let f=todos.filter(n=>n.toLowerCase().includes(q)).slice(0,12);
if(!f.length){list.innerHTML='<div style="padding:10px;font-size:10px">Sin resultados</div>';list.style.display='block';return;}
list.innerHTML=f.map(n=>{
let d=clientes[n]; return `<div style="padding:10px 12px;border-bottom:1px solid #f3f4f6;cursor:pointer" onclick="elegirCli('${n.replace(/'/g,"\\'")}')"><b style="font-size:11px">${n}</b><br><small style="color:#6b7280">${d.direccion}</small></div>`;
}).join('');
list.style.display='block';
}

window.elegirCli=function(nombre){
let d=clientes[nombre];
cliSel={nombre,direccion:d.direccion,lat:d.lat||null,lng:d.lng||null};
document.getElementById('buscCli').value=nombre;
document.getElementById('listCli').style.display='none';
let box=document.getElementById('selCliBox');
box.style.display='block';
box.innerHTML=`${nombre} - ${d.direccion} <button onclick="limpiarCli()" style="float:right;background:#fee2e2;border:none;padding:4px 8px;border-radius:8px;font-size:9px">X</button>`;
autoCotizar();
}

window.limpiarCli=function(){cliSel=null;document.getElementById('buscCli').value='';document.getElementById('selCliBox').style.display='none';document.getElementById('infoRuta').style.display='none';pedidoCotizado=null;}

function initMap(){
let c={lat:21.1016,lng:-100.9318};
map=new google.maps.Map(document.getElementById('map'),{center:c,zoom:14});
dirServ=new google.maps.DirectionsService();
dirRend=new google.maps.DirectionsRenderer({suppressMarkers:true,map:map,polylineOptions:{strokeColor:'#0a0a0a',strokeWeight:6}});
let inpE=document.getElementById('dirEntrega');
autEntrega=new google.maps.places.Autocomplete(inpE);
autEntrega.addListener('place_changed',()=>{autoCotizar();});
let inpM=document.getElementById('dirManual');
autManual=new google.maps.places.Autocomplete(inpM);
}
initMap();

let debounce=null;
function autoCotizar(){
clearTimeout(debounce);
debounce=setTimeout(()=>{if(puedeCotizar()) cotizar();},700);
}
document.getElementById('dirEntrega').addEventListener('input',autoCotizar);
document.getElementById('telEntrega').addEventListener('input',autoCotizar);
document.getElementById('refEntrega').addEventListener('input',()=>{});

function puedeCotizar(){
let entrega=document.getElementById('dirEntrega').value.trim();
if(entrega.length<5) return false;
if(modo==='cli' &&!cliSel) return false;
if(modo==='dir'){
if(!document.getElementById('nombreNuevo').value.trim() ||!document.getElementById('dirManual').value.trim()) return false;
}
return true;
}

function geocode(dir){
return new Promise(res=>{
let g=new google.maps.Geocoder();
g.geocode({address:dir},(r,s)=>{if(s==='OK'&&r[0]){let l=r[0].geometry.location;res({lat:l.lat(),lng:l.lng()});}else res(null);});
});
}

function costoKm(km){return Math.round((tarifas.mandado||35)+Math.max(0,km-2)*6);}

window.cotizar=async function(){
let entregaDir=document.getElementById('dirEntrega').value.trim();
if(!entregaDir) return alert('Falta entrega');
let recogida=null;
if(modo==='cli'){
if(!cliSel) return alert('Elige cliente');
recogida={nombre:cliSel.nombre,direccion:cliSel.direccion,lat:cliSel.lat,lng:cliSel.lng,telefono:document.getElementById('telRecoge').value.trim()};
}else{
recogida={nombre:document.getElementById('nombreNuevo').value.trim(),direccion:document.getElementById('dirManual').value.trim(),lat:null,lng:null,telefono:document.getElementById('telRecogeDir').value.trim()};
}
let btn=document.querySelector('.btn'); btn.innerText='COTIZANDO...';
try{
let oLatLng=recogida.lat&&recogida.lng?{lat:recogida.lat,lng:recogida.lng}:await geocode(recogida.direccion);
if(!oLatLng) throw new Error('No se pudo ubicar recogida');
let dLatLng=await geocode(entregaDir);
if(!dLatLng) throw new Error('No se pudo ubicar entrega');

let ruta=await new Promise((res,rej)=>{
dirServ.route({origin:oLatLng,destination:dLatLng,travelMode:'DRIVING'},(r,s)=>{if(s==='OK'){let leg=r.routes[0].legs[0]; dirRend.setDirections(r); new google.maps.Marker({position:oLatLng,map:map}); new google.maps.Marker({position:dLatLng,map:map}); res({km:(leg.distance.value/1000).toFixed(1),min:Math.round(leg.duration.value/60)});}else rej('Ruta no disponible');});
});

let costo=costoKm(parseFloat(ruta.km));
pedidoCotizado={recogida,entrega:{direccion:entregaDir,lat:dLatLng.lat,lng:dLatLng.lng,telefono:document.getElementById('telEntrega').value.trim(),referencia:document.getElementById('refEntrega').value.trim()},km:ruta.km,min:ruta.min,costo,iso:todayISO()};
document.getElementById('infoRuta').style.display='block';
document.getElementById('infoRuta').innerHTML=`${ruta.km} km • ${ruta.min} min • $${costo}<br><small>Recoge: ${recogida.direccion}<br>Entrega: ${entregaDir} ${pedidoCotizado.entrega.referencia?`• Ref: ${pedidoCotizado.entrega.referencia}`:''} ${pedidoCotizado.entrega.telefono?`• Tel: ${pedidoCotizado.entrega.telefono}`:''}</small>`;
}catch(e){alert(e.message);}
finally{btn.innerText='COTIZAR CON GOOGLE MAPS';}
}

window.confirmar=async function(){
if(!pedidoCotizado) return alert('Primero cotiza');
let repa=document.getElementById('selRepa').value;
if(!repa) return alert('Elige repa');
let p=pedidoCotizado;
let payload={iso:p.iso,cliente:p.recogida.nombre,dirRecogida:p.recogida.direccion,entrega:p.entrega.direccion,referencia:p.entrega.referencia,telefono:p.entrega.telefono,telefonoRecogida:p.recogida.telefono,lat1:p.recogida.lat,lng1:p.recogida.lng,lat2:p.entrega.lat,lng2:p.entrega.lng,km:p.km,min:p.min,costoSugerido:p.costo,repaAsignado:repa,etapa:'pendiente',ts:Date.now()};
let nr=push(ref(db,'kigoPedidosLive'));
await set(nr,payload);
alert('Pedido enviado a '+repa);
document.getElementById('dirEntrega').value='';document.getElementById('telEntrega').value='';document.getElementById('refEntrega').value='';
document.getElementById('infoRuta').style.display='none';pedidoCotizado=null;
}
</script>
</body>
</html>
